azure:
  settings_osx:
    timeoutInMinutes: 1
  settings_win:
    timeoutInMinutes: 1
build_platform:
  osx_64: osx_arm64
conda_build:
  pkg_format: '2'
conda_build_tool: rattler-build
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
provider:
  linux_aarch64: github_actions
  linux_64: github_actions
  osx_arm64: github_actions
  win_64: github_actions
test: native_and_emulated
workflow_settings:
  build_workspace_dir:
    - os: win
      value: C:\bld\
  tools_install_dir:
    - os: win
      value: C:\Miniforge
